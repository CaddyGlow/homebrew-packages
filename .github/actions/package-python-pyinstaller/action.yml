name: Package Python Binary with PyInstaller
description: Builds standalone binary with PyInstaller and creates release archive

inputs:
  binary_name:
    description: 'Name of the binary to build'
    required: true
  version:
    description: 'Version tag (e.g., v0.2.0 or 0.2.0)'
    required: true
  target:
    description: 'Target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  archive_format:
    description: 'Archive format: tar.gz or zip'
    required: true
  exe_suffix:
    description: 'Executable suffix (.exe for Windows, empty for Unix)'
    required: false
    default: ''
  assets:
    description: 'JSON array of asset paths to include'
    required: false
    default: '[]'
  entry_point:
    description: 'Python module entry point (e.g., ccproxy.cli:main)'
    required: true
  extra_smoke_command:
    description: 'Optional additional smoke command to run via the built binary (e.g., "plugins list")'
    required: false
    default: ''
  extras:
    description: 'Comma-separated list of optional dependency groups to install before freezing (e.g., "plugins-claude,plugins-codex"). Defaults to "all" which installs every group declared in pyproject.toml under [project.optional-dependencies]. Pass an empty string to skip installing the project entirely.'
    required: false
    default: 'all'

runs:
  using: composite
  steps:
    - name: Install project and optional extras
      shell: bash
      run: |
        set -euo pipefail
        EXTRAS="${{ inputs.extras }}"
        if [ -z "$EXTRAS" ]; then
          echo "Skipping project install (extras input is empty)"
          exit 0
        fi
        if [ ! -f "pyproject.toml" ]; then
          echo "::warning::No pyproject.toml found in $PWD; skipping project install"
          exit 0
        fi
        # Convert "all" to a shell glob: get the group names from pyproject.toml
        # and pass them as one bracket expression so uv/pip picks every group.
        if [ "$EXTRAS" = "all" ]; then
          # Extract all keys under [project.optional-dependencies] using a Python one-liner.
          GROUP_NAMES=$(python3 -c "
          import re, sys
          text = open('pyproject.toml').read()
          m = re.search(r'\[project\.optional-dependencies\](.*?)(?:^\[|\Z)', text, re.S | re.M)
          if not m:
              sys.exit(0)
          for line in m.group(1).splitlines():
              mm = re.match(r'\s*([A-Za-z0-9_.-]+)\s*=\s*\[', line)
              if mm:
                  print(mm.group(1))
          ")
          if [ -n "$GROUP_NAMES" ]; then
            # Build a single bracket expression: [g1,g2,g3]
            BRACKET=$(printf ',%s' $GROUP_NAMES)
            BRACKET="[${BRACKET:1}]"
            echo "Installing project with all extras: $BRACKET"
            uv pip install ".${BRACKET}"
          else
            echo "::warning::[project.optional-dependencies] not found in pyproject.toml; installing project without extras"
            uv pip install .
          fi
        else
          echo "Installing project with extras: $EXTRAS"
          # Convert "a,b,c" to "[a,b,c]" so uv treats it as a single selector
          BRACKET="[${EXTRAS}]"
          uv pip install ".${BRACKET}"
        fi

    - name: Install PyInstaller
      shell: bash
      run: |
        uv pip install pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        set -euo pipefail

        BINARY_NAME="${{ inputs.binary_name }}"
        ENTRY_POINT="${{ inputs.entry_point }}"

        # Parse entry_point format (module.path:function)
        MODULE=$(echo "$ENTRY_POINT" | cut -d: -f1)
        FUNCTION=$(echo "$ENTRY_POINT" | cut -d: -f2)
        PACKAGE_ROOT="${MODULE%%.*}"
        PACKAGE_ROOT_PATH="${PACKAGE_ROOT//./\/}"

        PYINSTALLER_FLAGS="--collect-all ${PACKAGE_ROOT} --hidden-import=${MODULE}"

        if [ -d "${PACKAGE_ROOT_PATH}/plugins" ]; then
          PYINSTALLER_FLAGS="${PYINSTALLER_FLAGS} --collect-submodules ${PACKAGE_ROOT}.plugins"
        fi

        # Preserve package metadata so importlib.metadata.entry_points() can
        # discover plugins at runtime. PyInstaller has a hook that calls
        # importlib.metadata.distribution() — it uses the project NAME (from
        # pyproject.toml's [project] name field), which often differs from the
        # importable package root (e.g. project name 'ccproxy-api' vs package
        # root 'ccproxy'). Read the actual project name from pyproject.toml.
        if [ -f "pyproject.toml" ]; then
          PROJECT_NAME=$(python3 -c "
          import re
          m = re.search(r'^name\s*=\s*[\"\']([^\"\']+)[\"\']', open('pyproject.toml').read(), re.M)
          print(m.group(1) if m else '')
          ")
          if [ -n "$PROJECT_NAME" ]; then
            PYINSTALLER_FLAGS="${PYINSTALLER_FLAGS} --copy-metadata ${PROJECT_NAME}"
          fi
        fi

        # Create a temporary entry script for PyInstaller
        cat > __pyinstaller_entry__.py <<EOF
        from ${MODULE} import ${FUNCTION}
        if __name__ == '__main__':
            ${FUNCTION}()
        EOF

        # Build standalone binary
        uv run pyinstaller \
          --onefile \
          --name "$BINARY_NAME" \
          --noconfirm \
          --clean \
          ${PYINSTALLER_FLAGS} \
          __pyinstaller_entry__.py

        # Clean up temp script
        rm -f __pyinstaller_entry__.py

    - name: Smoke test binary
      shell: bash
      run: |
        set -euo pipefail

        BINARY_PATH="dist/${{ inputs.binary_name }}${{ inputs.exe_suffix }}"
        EXTRA_SMOKE_COMMAND="${{ inputs.extra_smoke_command }}"

        "$BINARY_PATH" --version

        if [ -n "$EXTRA_SMOKE_COMMAND" ]; then
          bash -lc "\"$BINARY_PATH\" $EXTRA_SMOKE_COMMAND"
        fi

        # Strict smoke check: fail the build if the binary reports zero
        # discoverable plugins/auth-providers. This catches the case where
        # pyinstaller collected the source but didn't preserve entry-point
        # metadata, which would otherwise produce a binary that runs but
        # has no functionality. (See CaddyGlow/ccproxy-api#75.)
        if [ -n "$EXTRA_SMOKE_COMMAND" ] && echo "$EXTRA_SMOKE_COMMAND" | grep -qE '(plugins|auth)\s+(list|providers)'; then
          OUT=$("$BINARY_PATH" $EXTRA_SMOKE_COMMAND 2>&1 || true)
          if echo "$OUT" | grep -qiE 'no plugins found|no oauth providers found'; then
            echo "::error::Smoke check failed: binary reports no plugins/providers."
            echo "$OUT"
            exit 1
          fi
        fi

    - name: Package (Windows)
      if: inputs.archive_format == 'zip'
      shell: pwsh
      run: |
        $BINARY_NAME = "${{ inputs.binary_name }}"
        $VERSION = "${{ inputs.version }}"
        $TARGET = "${{ inputs.target }}"
        $ASSETS = '${{ inputs.assets }}' | ConvertFrom-Json

        New-Item -ItemType Directory -Force -Path dist-archive

        # Copy the built binary
        Copy-Item "dist/$BINARY_NAME${{ inputs.exe_suffix }}" "dist-archive/$BINARY_NAME${{ inputs.exe_suffix }}"

        # Copy assets if any
        foreach ($ASSET in $ASSETS) {
          if (Test-Path $ASSET) {
            Copy-Item $ASSET -Destination dist-archive -Recurse
          }
        }

        $ARCHIVE_NAME = "$BINARY_NAME-$VERSION-$TARGET.zip"
        $itemsToCompress = Get-ChildItem -Path dist-archive -File
        Compress-Archive -Path $itemsToCompress.FullName -DestinationPath "dist/$ARCHIVE_NAME"

        # Remove bare binary to avoid duplicate uploads (only keep the archive)
        Remove-Item "dist/$BINARY_NAME${{ inputs.exe_suffix }}"

        Write-Output "Created archive: $ARCHIVE_NAME"
        Get-ChildItem dist

    - name: Package (Unix)
      if: inputs.archive_format != 'zip'
      shell: bash
      run: |
        mkdir -p dist-archive
        BINARY_NAME="${{ inputs.binary_name }}"
        VERSION="${{ inputs.version }}"
        TARGET="${{ inputs.target }}"
        ASSETS='${{ inputs.assets }}'

        # Copy the built binary
        cp "dist/$BINARY_NAME${{ inputs.exe_suffix }}" "dist-archive/$BINARY_NAME${{ inputs.exe_suffix }}"
        chmod +x "dist-archive/$BINARY_NAME${{ inputs.exe_suffix }}"

        # Copy assets if any
        if [ "$ASSETS" != "[]" ]; then
          echo "$ASSETS" | jq -r '.[]' | while read -r ASSET; do
            if [ -e "$ASSET" ]; then
              cp -r "$ASSET" dist-archive/
            fi
          done
        fi

        # Create archive with version and full target triple for unique naming
        cd dist-archive
        ARCHIVE_NAME="$BINARY_NAME-$VERSION-$TARGET.tar.gz"
        tar czf "../dist/$ARCHIVE_NAME" *
        cd ..

        # Remove bare binary to avoid duplicate uploads (only keep the archive)
        rm -f "dist/$BINARY_NAME${{ inputs.exe_suffix }}"

        echo "Created archive: $ARCHIVE_NAME"
        ls -lh dist/
